<!doctype html>
<!--
  文章模板 · 使用说明
  ------------------------------------------------------------------
  1. 复制本文件到 posts/ 目录，重命名为「YYYY-MM-DD-slug.html」。
  2. 替换下面所有 {{占位符}}。
     {{TITLE}}          文章标题（同时用于 <title> 和 h1）
     {{DESCRIPTION}}    meta description，一句话即可
     {{DATE_ISO}}       例 2026-10-27
     {{DATE_DISPLAY}}   例 2026 年 10 月 27 日
     {{TAGS}}           例 随笔 · 约 3 分钟
     {{LEAD}}           导语，一段话；不想用可以整段删掉
     {{BODY}}           正文，可用的元素见下方注释
  3. 相对路径 ../ 不能删，否则样式和导航会失效。
  4. 最后记得在 index.html 的文章列表里加一条链接。
  ------------------------------------------------------------------
  正文常用元素：

  <p>普通段落</p>
  <h2>二级标题</h2>
  <h3>三级标题</h3>
  <ul><li>列表项</li></ul>
  <blockquote><p>引用</p></blockquote>
  <pre><code>代码块</code></pre>
  行内代码 <code>npm install</code>
  <figure>
    <img src="../assets/img/posts/slug/example.jpg" alt="图片说明">
    <figcaption>图注</figcaption>
  </figure>
  <hr>
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Freesun's blog</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="article">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/article.css">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../index.html">Freesun's blog</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="../index.html" aria-current="page">文章</a>
        <a href="../about.html">关于</a>
        <a href="../contact.html">联系</a>
        <a href="https://www.freesun.top" target="_blank" rel="noopener">旧博客</a>
        <a href="../youlian.html">友链</a>
        <button class="theme-toggle" type="button" aria-label="切换深浅色主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <article class="article">
      <header class="article-head">
        <p class="article-meta">
          <time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>
          <span class="dot">·</span>
          <span class="tag">{{TAGS}}</span>
        </p>
        <h1>{{TITLE}}</h1>
        <p class="article-lead">{{LEAD}}</p>
      </header>

      <div class="prose">
        {{BODY}}
      </div>

      <footer class="article-foot">
        <a class="back-link" href="../index.html">← 返回文章列表</a>
        <span>{{DATE_DISPLAY}}</span>
      </footer>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© <span data-year>2026</span> Freesun's blog</p>
    </div>
  </footer>

  <script src="../assets/js/main.js"></script>
</body>
</html>
